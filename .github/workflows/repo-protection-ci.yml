name: LUMI Repository Protection & Performance Guardrail CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  guardrail-protection-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20+)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run TypeScript Type Check & Guardrail Enforcement Audit
        run: npm test
